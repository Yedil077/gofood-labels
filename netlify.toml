# Netlify: статический React + функции (API) + Blobs (данные)

[build]
  base = "."
  command = "cd web && npm install && npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# /api/* -> одна функция-роутер
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm --prefix web run dev"
  targetPort = 5180
  port = 8888
  publish = "web/dist"
