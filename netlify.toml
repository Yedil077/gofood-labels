# Netlify: статический React (web/dist) + функция-роутер /api/* + Blobs (данные)

[build]
  base = "."
  command = "cd web && npm install && npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# /api/* обслуживает функция netlify/functions/api.js (в ней `export const config = { path: "/api/*" }`).
# SPA-фолбэк (/* -> /index.html) лежит в web/public/_redirects, чтобы не мешать `netlify dev`.

[dev]
  command = "npm --prefix web run dev"
  targetPort = 5180
  port = 8888
