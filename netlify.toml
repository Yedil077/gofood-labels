# Netlify: статический React (web/dist) + функция-роутер /api/* + Blobs (данные)

[build]
  base = "."
  command = "cd web && npm install && npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# /api/* -> функция-роутер. Явное правило в toml (важно для продакшена).
# SPA-фолбэк (/* -> /index.html) — только в web/public/_redirects, иначе ломает `netlify dev`
# (перехватывает /src/*.tsx и отдаёт index.html с неверным MIME).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[dev]
  command = "npm --prefix web run dev"
  targetPort = 5180
  port = 8888
